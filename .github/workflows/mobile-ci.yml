name: Mobile CI

on:
  pull_request:
    paths:
      - "mobile/coffeecrush-mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [master]
    paths:
      - "mobile/coffeecrush-mobile/**"
      - ".github/workflows/mobile-ci.yml"

defaults:
  run:
    working-directory: mobile/coffeecrush-mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mobile/coffeecrush-mobile

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: detekt
        run: ./gradlew detekt --stacktrace

      - name: lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew test testDebugUnitTest --stacktrace

      - name: Engine coverage (>= 90%)
        run: ./gradlew :core:engine:koverVerify --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: mobile/coffeecrush-mobile/**/build/reports

  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mobile/coffeecrush-mobile

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # RR-13: assembling release exercises R8 (isMinifyEnabled) + shrinkResources; the build
      # itself catches missing keep rules the trace step can prove are unreachable, but only an
      # install + launch on a real Android runtime catches rules that are missing at *runtime*
      # (e.g. a reflectively-accessed class R8 stripped without complaint).
      - name: Assemble release (R8 + shrinkResources)
        run: ./gradlew assembleRelease --stacktrace

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch the release APK, fail on crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: mobile/coffeecrush-mobile
          script: |
            adb install -r app/build/outputs/apk/release/app-release-unsigned.apk
            adb shell am start -W -n com.semstress.mobile/.MainActivity
            sleep 8
            if adb shell pidof com.semstress.mobile > /dev/null; then
              echo "App is running after launch, smoke test passed."
            else
              echo "App crashed shortly after launch."
              adb logcat -d "*:E" | tail -n 200
              exit 1
            fi

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: mobile/coffeecrush-mobile/**/build/reports
