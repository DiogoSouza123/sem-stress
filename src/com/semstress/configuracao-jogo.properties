# Tabuleiro
tabuleiro.linhas=6
tabuleiro.colunas=6
tabuleiro.tipos_peca=6

# Regras
regras.tamanho_minimo_match=3
regras.somente_troca_adjacente=true
regras.consumir_movimento_troca_invalida=false
regras.resolver_matches_iniciais=true

# Pontuacao
pontuacao.match_3=500
pontuacao.match_4=1000
pontuacao.match_5_ou_mais=1500
pontuacao.multiplicador_cascata=1
pontuacao.pontuar_cascata=true

# Jogo
jogo.movimentos_iniciais=15
jogo.meta_pontos=15000
jogo.semente_aleatoria=

# Interface
ui.exibir_numeros_pecas=false
ui.recurso_background=/com/semstress/images/background.gif

# Audio
audio.habilitar_musica_fundo=true
audio.recurso_musica_fundo=/com/semstress/audio/fur-elise.wav
audio.volume_percentual=70

# Animacoes
animacao.explosao.habilitada=true
animacao.explosao.recurso=/com/semstress/images/grenade.gif
animacao.explosao.duracao_ms=2000
animacao.queda.intervalo_ms=250
animacao.cascata.pausa_ms=250
